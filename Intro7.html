<!DOCTYPE html>
<html>
    <head>
        <title>
            Forms
        </title>
    </head>
    <body>
        <form>
            <label>
                Name
            </label> <br>
            <input type="text" id="Name"> <br> <br>
            <label>
                Email address
            </label><br>
            <input type="text" id="email"><br><br>
            <label>
                contact number
            </label><br>
            <input type="password" id="contact"><br><br>
            <label>
                Gender
            </label><br>
            <input type="radio" id="female" name="gender" value="female"> female <br>
            <input type="radio" id="male" name="gender" value="male"> male<br><br>
            <label>
                Favorite city
            </label><br>
            <input type="checkbox" id="Seattle" name="city" value="seattle">Seattle<br>
            <input type="checkbox" id="New york"name=city value="New york">New York<br>
            <input type="submit"> 
        </form> 
    </body>
</html>
