<!DOCTYPE html>
<html>
    <head>
        <title>
            Rotate
        </title>
        <style>
            div {
                width:300px;
                height:100px;
                background-color:red;
                border: 1px solid rgb(0, 0, 0);
            }
            #mydiv {
                transform: rotateX(-180deg)
            }
        </style>
    </head>
    <body>
        <h1>
            Welcome to the world of rotations
        </h1>
        <p>Ready to learn the rotation method?</p>
        <div>
            Codingal
        </div>
        <div id="mydiv">
            Condingal
        </div>
    </body>
</html>
