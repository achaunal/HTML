<!DOCTYPE html>
<html>
    <head>
        <title>
            there is no real color to the box...
        </title>
        <style>
            /* The animation code */
            @keyframes example{
                0% {background-color:red;}
                25% {background-color:yellow;}
                50%{background-color:blue;}
                100% {background-color:green;}
            }
            /* The element to apply the admiration to*/
            div {
                width: 5000px;
                height: 1000px;
                background-color:red;
                animation-name: example;
                animation-duration: 4s;
            }
        </style>
    </head>
    <body>
        <div>
            Hi!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!
        </div>
    </body>
</html>
